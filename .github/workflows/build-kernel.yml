name: Build NetHunter GKI Kernel

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-gki-kernel:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Build Environment
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            git build-essential bc bison flex libssl-dev \
            libncurses5-dev libncursesw5-dev device-tree-compiler \
            lz4 xz-utils wget curl python3 python3-pip ccache \
            libelf-dev libxml2-utils kmod cpio qttools5-dev \
            libqt5widgets5 fakeroot zip unzip lynx pandoc \
            axel binutils-aarch64-linux-gnu

      - name: Build GKI NetHunter kernel
        run: |
          chmod +x build_gki_kernel.sh
          ./build_gki_kernel.sh

      - name: Upload kernel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nethunter-kernel-artifacts
          path: |
            output/
          if-no-files-found: error
          retention-days: 15
